<div class="c-create-page">
    <app-header></app-header>
    <main class="c-create-content">
        <section class="c-create-panel">
            <h2 class="c-create-title">Solicitar Tarjeta</h2>
            <form (submit)="createCard($event)" class="c-create-form">
                <div class="c-create-fields">
                    <div class="c-form-group">
                        <label for="holder">Nombre del titular</label>
                        <input
                            type="text"
                            id="holder"
                            placeholder="Nombre y apellidos"
                            [value]="holderName"
                            [readOnly]="!!holderName"
                            required>
                    </div>

                    <fieldset class="c-form-group c-form-group--card-type-group">
                        <legend>Tipo de tarjeta</legend>
                        <div class="c-card-type-options">
                            <label class="c-card-type-option" [class.g--is-selected]="cardType === 'debit'">
                                <input
                                    type="radio"
                                    name="cardType"
                                    value="debit"
                                    [checked]="cardType === 'debit'"
                                    (change)="cardType = 'debit'; clearCardError()">
                                <span class="c-card-type-title">Debito</span>
                                <span class="c-card-type-text">Pago al instante</span>
                            </label>
                            <label class="c-card-type-option" [class.g--is-selected]="cardType === 'credit'">
                                <input
                                    type="radio"
                                    name="cardType"
                                    value="credit"
                                    [checked]="cardType === 'credit'"
                                    (change)="cardType = 'credit'; clearCardError()">
                                <span class="c-card-type-title">Credito</span>
                                <span class="c-card-type-text">Pago a fin de mes</span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="c-form-group">
                        <label for="account">Cuenta vinculada</label>
                        <select id="account" required [(ngModel)]="selectedAccountId" name="account" (ngModelChange)="clearCardError()">
                            <option value="" disabled>Selecciona una cuenta</option>
                            @for (account of accountOptions; track account.id) {
                                <option [value]="account.id">
                                    {{ account.label }}
                                </option>
                            }
                        </select>
                    </div>

                    @if (cardError) {
                        <p class="c-form-error">{{ cardError }}</p>
                    }
                </div>

                <aside class="c-create-right">
                    <div class="c-card-preview">
                        <img
                            class="c-card-preview__image"
                            [src]="cardType === 'debit' ? '/images/tarjeta-debito.png' : '/images/tarjeta-credito.png'"
                            [alt]="cardType === 'debit' ? 'Tarjeta debito' : 'Tarjeta credito'">
                        <div class="c-card-preview__caption">
                            {{ cardType === 'debit' ? 'Tarjeta debito' : 'Tarjeta credito' }}
                        </div>
                    </div>
                </aside>

                <div class="c-form-actions">
                    <button type="submit" class="c-btn-primary">Solicitar</button>
                    <a routerLink="/cards" class="c-btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
    <app-footer></app-footer>
</div>
