<div class="card-detail-page">
    <app-header></app-header>
    <main class="card-detail-content">
        <!-- Card Info Section -->
        <section class="info-container">
            <div class="card-visual">
                <img src="/images/tarjeta-credito-sin-fondo.jpeg" alt="Card Design" class="card-visual-img">
            </div>

            <div class="card-info">
                <h2 class="card-title">{{ card.name }} {{ card.number.split(' ')[1] }}</h2>
                <div class="card-balance">{{ card.amount }}</div>

                <div class="quick-actions">
                    <div class="action-item" *ngFor="let action of actions">
                        <div class="action-btn">
                            <img [src]="action.icon" [alt]="action.label">
                        </div>
                        <span class="action-label">{{ action.label }}</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Movements Section -->
        <section class="detail-container movements-container">
            <h3 class="container-subtitle">Ultimos movimientos</h3>
            <div class="movements-list">
                <div class="movement-row" *ngFor="let movement of movements">
                    <div class="movement-left">
                        <span class="movement-concept">{{ movement.concept }}</span>
                        <span class="movement-date">{{ movement.date }}</span>
                    </div>
                    <div class="movement-amount" [class.negative]="movement.amount.startsWith('-')">
                        {{ movement.amount }}
                    </div>
                </div>
            </div>
        </section>
    </main>
    <app-footer></app-footer>
</div>
