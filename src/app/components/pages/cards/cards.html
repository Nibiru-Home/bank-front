<div class="c-cards-page">
    <app-header></app-header>
    <main class="c-cards-content">
        <section class="c-cards-section" aria-label="Tarjetas">
            <div class="c-cards-container">
                <div class="c-cards-header">
                    <div class="c-cards-header__title">
                        <h2>Tarjetas</h2>
                    </div>
                    <a routerLink="/cards/new" class="c-btn-create">+ Nueva Tarjeta</a>
                </div>

                <div class="c-cards-list">
                    @for (card of cards; track card.id) {
                        <app-card-row [id]="card.id" [name]="card.name" [pan]="card.pan" [holder]="card.holder"
                            [amount]="card.amount" [cardType]="card.type || 'debit'">
                        </app-card-row>
                    }
                </div>
            </div>
        </section>
    </main>
    <app-footer></app-footer>
</div>
