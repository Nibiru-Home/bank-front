<div class="c-create-page">
    <app-header></app-header>
    <main class="c-create-content">
        <section class="c-create-panel">
            <h2 class="c-create-title">Nueva Cuenta</h2>
            <form (submit)="createAccount($event)" class="c-create-form c-create-form--single">
                <div class="c-create-fields">
                    <div class="c-form-group">
                        <label for="holder">Nombre del titular</label>
                        <input
                            type="text"
                            id="holder"
                            placeholder="Nombre y apellidos"
                            [value]="holderName"
                            [readOnly]="!!holderName"
                            required>
                    </div>

                    <div class="c-form-group">
                        <label for="type">Tipo de cuenta</label>
                        <select id="type" required>
                            <option value="standard">Cuenta Corriente</option>
                            <option value="savings">Cuenta Ahorro</option>
                            <option value="business">Cuenta Negocios</option>
                        </select>
                    </div>
                </div>

                <div class="c-form-actions">
                    <button type="submit" class="c-btn-primary">Crear Cuenta</button>
                    <a routerLink="/accounts" class="c-btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
    <app-footer></app-footer>
</div>
