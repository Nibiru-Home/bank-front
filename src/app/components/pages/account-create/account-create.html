<div class="create-page">
    <app-header></app-header>
    <main class="create-content">
        <section class="create-panel">
            <h2 class="create-title">Nueva Cuenta</h2>
            <form (submit)="createAccount($event)" class="create-form create-form--single">
                <div class="create-fields">
                    <div class="form-group">
                        <label for="holder">Nombre del titular</label>
                    <input
                        type="text"
                        id="holder"
                        placeholder="Nombre y apellidos"
                        [value]="holderName"
                        [readOnly]="!!holderName"
                        required>
                    </div>

                    <div class="form-group">
                        <label for="type">Tipo de cuenta</label>
                        <select id="type" required>
                            <option value="standard">Cuenta Corriente</option>
                            <option value="savings">Cuenta Ahorro</option>
                            <option value="business">Cuenta Negocios</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Crear Cuenta</button>
                    <a routerLink="/accounts" class="btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
    <app-footer></app-footer>
</div>
