<div class="index-page">
  <app-header></app-header>
  <main class="index-content">
    <div class="index-grid">
      <div class="index-right">
        <div class="index-welcome">
          <span class="index-welcome__text">Bienvenid@ {{ currentUserName }}</span>
        </div>
        <app-balance-card
          [amount]="totalBalance.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' })"></app-balance-card>
        <section class="quick-actions" aria-label="Acciones rapidas">
          <app-quick-action label="Enviar dinero" iconSrc="images/iconos/transferir-dinero.png" routerLink="/incidencias">
          </app-quick-action>
          <app-quick-action label="Contratar" iconSrc="images/iconos/contratar.png" routerLink="/contratar-productos">
          </app-quick-action>
          <app-quick-action label="Recibos" iconSrc="images/iconos/recibo.png" routerLink="/incidencias">
          </app-quick-action>
          <app-quick-action label="Cajeros" iconSrc="images/iconos/cajero-automatico.png"
            href="https://www.bancosantander.es/buscador-oficinas-cajeros">
          </app-quick-action>
          <app-quick-action label="Incidencias" iconSrc="images/iconos/peligro.png" routerLink="/incidencias">
          </app-quick-action>
        </section>
        <section class="accounts-section" aria-label="Cuentas">
          <div class="section-header">
            <div class="section-header__left">
              <span class="section-marker"></span>
              <span class="section-title">
                {{ accounts.length }} {{ accounts.length === 1 ? 'Cuenta' : 'Cuentas' }}
              </span>
            </div>
          </div>

          <a class="account-card account-card--link" *ngFor="let account of accounts"
            [routerLink]="['/accounts', account.id]">
            <span class="account-card__icon">
              <img src="images/iconos/cuentas-bancarias.png" alt="" aria-hidden="true">
            </span>
            <div class="account-card__info">
              <span class="account-card__name">{{ account.name }}</span>
              <span class="account-card__iban">{{ account.iban }}</span>
            </div>
            <span class="account-card__amount">{{ account.balance }}</span>
          </a>
        </section>

        <section class="cards-section" aria-label="Tarjetas">
          <div class="section-header">
            <div class="section-header__left">
              <span class="section-marker"></span>
              <span class="section-title">
                {{ cards.length }} {{ cards.length === 1 ? 'Tarjeta' : 'Tarjetas' }}
              </span>
            </div>
          </div>

          <a class="card-item card-item--link" *ngFor="let card of cards" [routerLink]="['/cards', card.id]">
            <span class="card-item__icon">
              <img src="images/iconos/tarjeta-bancaria.png" alt="" aria-hidden="true">
            </span>
            <div class="card-item__info">
              <span class="card-item__name">{{ card.name }}</span>
              <span class="card-item__meta">{{ card.type }} • {{ card.pan.slice(-4) }}</span>
            </div>
          </a>
        </section>
      </div>
      <app-insights-card></app-insights-card>
    </div>
  </main>
  <app-footer></app-footer>
</div>
