<div class="account-detail-page">
    <app-header></app-header>
    <main class="account-detail-content">
        <!-- Account Info Card -->
        <section class="detail-card info-card">
            <h2 class="card-title">{{ account.name }}</h2>
            <div class="account-balance">{{ account.amount }}</div>
        </section>

        <!-- Movements Card -->
        <section class="detail-card movements-card">
            <h3 class="card-subtitle">Ultimos movimientos</h3>
            <div class="movements-list">
                <div class="movement-row" *ngFor="let movement of movements">
                    <div class="movement-left">
                        <span class="movement-concept">{{ movement.concept }}</span>
                        <span class="movement-date">{{ movement.date }}</span>
                    </div>
                    <div class="movement-amount" [class.negative]="movement.amount.startsWith('-')">
                        {{ movement.amount }}
                    </div>
                </div>
            </div>
        </section>
    </main>
    <app-footer></app-footer>
</div>
