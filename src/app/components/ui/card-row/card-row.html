<a class="c-card-row c-card-row--link" [routerLink]="['/cards', id]">
    <div class="c-card-row__left">
        <span class="c-card-row__media">
            <img
                [src]="cardType === 'credit' ? '/images/tarjeta-credito.png' : '/images/tarjeta-debito.png'"
                [alt]="cardType === 'credit' ? 'Tarjeta credito' : 'Tarjeta debito'">
        </span>
        <div class="c-card-row__info">
            <div class="c-card-name">{{ name }}</div>
            <div class="c-card-pan">{{ pan }}</div>
            <div class="c-card-holder">{{ holder }}</div>
        </div>
    </div>
    <div class="c-card-row__right" [class.c-card-row__right--error]="hasInsufficientFunds()">
        <div class="c-card-amount" [class.c-card-amount--error]="hasInsufficientFunds()">{{ amount }}</div>
        @if (hasInsufficientFunds()) {
            <div class="c-card-error">Error de tarjeta: saldo insuficiente</div>
        }
    </div>
</a>
