<a
  *ngIf="href; else buttonTemplate"
  class="ui-quick-action"
  [href]="href"
  target="_blank"
  rel="noopener noreferrer">
  <span class="ui-quick-action__icon">
    <img [src]="iconSrc" alt="" aria-hidden="true">
  </span>
  <span class="ui-quick-action__label">{{ label }}</span>
</a>

<ng-template #buttonTemplate>
  <button class="ui-quick-action" type="button">
    <span class="ui-quick-action__icon">
      <img [src]="iconSrc" alt="" aria-hidden="true">
    </span>
    <span class="ui-quick-action__label">{{ label }}</span>
  </button>
</ng-template>
