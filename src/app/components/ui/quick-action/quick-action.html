@if (routerLink) {
  <a class="c-ui-quick-action" [routerLink]="routerLink">
    <span class="c-ui-quick-action__icon">
      <img [src]="iconSrc" alt="" aria-hidden="true">
    </span>
    <span class="c-ui-quick-action__label">{{ label }}</span>
  </a>
} @else if (href) {
  <a
    class="c-ui-quick-action"
    [href]="href"
    target="_blank"
    rel="noopener noreferrer">
    <span class="c-ui-quick-action__icon">
      <img [src]="iconSrc" alt="" aria-hidden="true">
    </span>
    <span class="c-ui-quick-action__label">{{ label }}</span>
  </a>
} @else {
  <button class="c-ui-quick-action" type="button">
    <span class="c-ui-quick-action__icon">
      <img [src]="iconSrc" alt="" aria-hidden="true">
    </span>
    <span class="c-ui-quick-action__label">{{ label }}</span>
  </button>
}
