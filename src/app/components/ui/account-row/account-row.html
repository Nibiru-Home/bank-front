<a class="account-row account-row--link" [routerLink]="['/accounts', id]">
    <div class="account-row__left">
        <div class="account-name">{{ name }}</div>
        <div class="account-iban">{{ iban }}</div>
        <div class="account-holder">{{ holder }}</div>

    </div>
    <div class="account-row__right">
        <div class="account-amount">{{ amount }}</div>
    </div>
</a>
