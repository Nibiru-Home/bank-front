<a class="c-account-row c-account-row--link" [routerLink]="['/accounts', id]">
    <div class="c-account-row__left">
        <div class="c-account-name">{{ name }}</div>
        <div class="c-account-iban">{{ iban }}</div>
        <div class="c-account-holder">{{ holder }}</div>

    </div>
    <div class="c-account-row__right">
        <div class="c-account-amount">{{ amount }}</div>
    </div>
</a>
