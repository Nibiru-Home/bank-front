@if (notifications.errorMessage(); as errorMessage) {
  <section class="c-error-banner" role="alert" aria-live="assertive">
    <p class="c-error-banner__text">{{ errorMessage }}</p>
    <button
      type="button"
      class="c-error-banner__close"
      aria-label="Cerrar error"
      (click)="closeErrorBanner()">
      x
    </button>
  </section>
}

<router-outlet />
